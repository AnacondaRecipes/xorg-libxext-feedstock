{% set name = "xorg-libXext" %}
{% set version = "1.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: 6c643c7035cdacf67afd68f25d01b90ef889d546c9fcd7c0adf7c2cf91e3a32d

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11 aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - gettext
    - libtool
  host:
    - pthread-stubs ==0.3
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-util-macros ==1.20.2
  run:
    - {{ pin_compatible('xorg-libx11') }}

test:
  commands:
    - test -f $PREFIX/lib/libXext.dylib  # [osx]
    - test -f $PREFIX/lib/libXext.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxext
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxext
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org extensions library.
  description: |
    The X.org extensions library.

extra:
  recipe-maintainers:
    - pkgw
